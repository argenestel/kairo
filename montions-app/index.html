<!doctype html>
<html lang="en" data-mode="serious" data-chain="base">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#04070e" />
    <meta name="color-scheme" content="dark" />
    <title>Kairo — say it, print it, place it</title>
    <meta name="description" content="Outcome-first options and predictions on Base, Arbitrum and Solana. Say what you think will happen; print a ticket; place it onchain." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Kairo" />
    <meta property="og:title" content="Kairo — say it, print it, place it" />
    <meta property="og:description" content="Outcome-first options and predictions. Same event, every chain. Print a ticket." />
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Kairo — say it, print it, place it" />
    <meta name="twitter:description" content="Outcome-first options and predictions. Same event, every chain." />
    <meta name="twitter:image" content="/og.png" />
    <meta name="apple-mobile-web-app-title" content="Kairo" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500;600&family=Instrument+Serif:ital@1&family=M+PLUS+Rounded+1c:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var q = new URLSearchParams(location.search);
          var m = q.get('mode') || localStorage.getItem('montions.mode') || 'serious';
          if (m !== 'uwu') m = 'serious';
          document.documentElement.setAttribute('data-mode', m);
          var c = q.get('chain') || localStorage.getItem('montions.chain') || 'base';
          document.documentElement.setAttribute('data-chain', c);
          if (m === 'uwu') {
            document.documentElement.style.colorScheme = 'light';
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#f6e4ef');
            var scheme = document.querySelector('meta[name="color-scheme"]');
            if (scheme) scheme.setAttribute('content', 'light');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Kairo needs JavaScript to talk to the chain.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
